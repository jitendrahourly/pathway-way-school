<a
  class="brand"
  [class.brand--light]="variant() === 'light'"
  routerLink="/"
  [attr.aria-label]="settings().schoolName + ', home'"
>
  <span class="brand__crest">
    @if (!logoFailed()) {
      <img
        src="/images/brand/logo.png"
        alt=""
        width="120"
        height="110"
        (error)="logoFailed.set(true)"
      />
    } @else {
      <span class="brand__monogram" aria-hidden="true">BW</span>
    }
  </span>
  <span class="brand__text">
    <span class="brand__name">{{ settings().schoolName }}</span>
    <span class="brand__meta">{{ settings().managementName }}</span>
    <span class="brand__estd">Estd : {{ settings().establishedYear }}</span>
  </span>
</a>
