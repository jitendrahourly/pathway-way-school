<footer class="footer">
  <div class="container footer__grid">
    <div class="footer__brand">
      <app-brand-logo variant="light" />
      <p>{{ settings().footerDescription }}</p>
    </div>

    <nav class="footer__col" aria-label="Quick links">
      <h2>Quick Links</h2>
      <ul>
        @for (link of links; track link.path) {
          <li><a [routerLink]="link.path">{{ link.label }}</a></li>
        }
      </ul>
    </nav>

    <div class="footer__col">
      <h2>Contact Us</h2>
      <ul class="footer__contact">
        <li>
          <app-icon name="phone" [size]="15" />
          <a [href]="'tel:' + settings().phone">{{ settings().phone }}</a>
        </li>
        <li>
          <app-icon name="mail" [size]="15" />
          <a [href]="'mailto:' + settings().email">{{ settings().email }}</a>
        </li>
        <li>
          <app-icon name="map-pin" [size]="15" />
          <span>{{ settings().address }}</span>
        </li>
      </ul>
    </div>

    <div class="footer__col">
      <h2>Follow Us</h2>
      <div class="footer__socials">
        <a
          class="footer__social"
          [href]="settings().instagramUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="settings().schoolName + ' on Instagram'"
        >
          <app-icon name="instagram" [size]="18" />
        </a>
        <a
          class="footer__social"
          [attr.href]="settings().facebookUrl || null"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="settings().schoolName + ' on Facebook'"
        >
          <app-icon name="facebook" [size]="18" />
        </a>
        <a
          class="footer__social"
          [attr.href]="settings().youtubeUrl || null"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="settings().schoolName + ' on YouTube'"
        >
          <app-icon name="youtube" [size]="18" />
        </a>
      </div>
    </div>
  </div>

  <div class="footer__bottom">
    <div class="container">
      <p>&copy; {{ year }} {{ settings().schoolName }}. All Rights Reserved.</p>
    </div>
  </div>
</footer>
