<article class="facility" appTiltCard [class.facility--compact]="compact()">
  <app-media-frame
    class="facility__media"
    [src]="facility().imageUrl"
    [alt]="facility().imageAlt"
    ratio="4/3"
  />
  <div class="facility__body">
    <h3>{{ facility().title }}</h3>
    @if (!compact()) {
      <p>{{ facility().description }}</p>
    }
  </div>
</article>
