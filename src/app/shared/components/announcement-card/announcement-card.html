<a class="notice" [routerLink]="['/announcements', announcement().id]">
  @if (date(); as value) {
    <div class="notice__date" aria-hidden="true">
      <strong>{{ value.day }}</strong>
      <span>{{ value.month }}</span>
      <small>{{ value.year }}</small>
    </div>
  }

  <div class="notice__body">
    <p class="notice__category">{{ categoryLabel() }}</p>
    <h3>{{ announcement().title }}</h3>
    <p class="notice__summary">{{ announcement().summary }}</p>
  </div>

  <app-icon class="notice__arrow" name="chevron-right" [size]="18" />
</a>
