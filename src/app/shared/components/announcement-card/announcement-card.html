<a class="notice-card" [routerLink]="['/announcements', announcement().id]">
  @if (announcement().imageUrl) {
    <div class="notice-card__media">
      <img [src]="announcement().imageUrl" [alt]="announcement().imageAlt ?? announcement().title" />
    </div>
  } @else {
    <div class="notice-card__media notice-card__media--empty" aria-hidden="true">
      <app-icon name="megaphone" [size]="30" />
    </div>
  }

  <div class="notice-card__body">
    <p class="notice-card__category">{{ categoryLabel() }}</p>
    <h3>{{ announcement().title }}</h3>
    @if (date(); as value) {
      <p class="notice-card__date">{{ value.day }} {{ value.month }} {{ value.year }}</p>
    }
    <p class="notice-card__summary">{{ announcement().summary }}</p>
  </div>
</a>
