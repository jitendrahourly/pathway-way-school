    <nav class="admin-layout__nav" aria-label="Admin navigation">
      @for (item of navItems; track item.path) {
        <a
          class="admin-layout__nav-item"
          [routerLink]="item.path"
          routerLinkActive="admin-layout__nav-item--active"
          (click)="closeSidebar()"
        >
          <svg class="admin-layout__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="iconPath(item.icon)" />
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="admin-layout__sidebar-footer">
      <button type="button" class="admin-layout__logout" (click)="logout()" [disabled]="loading()">
        <svg class="admin-layout__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="iconPath('logout')" />
        </svg>
        <span>Logout</span>
      </button>
    </div>

  <div class="admin-layout__backdrop" (click)="closeSidebar()" aria-hidden="true"></div>

  <div class="admin-layout__main">

        <span class="admin-layout__user-role">{{ profile()?.role }}</span>
        <button type="button" class="admin-layout__logout-btn" (click)="logout()" [disabled]="loading()">Sign out</button>
      </div>
