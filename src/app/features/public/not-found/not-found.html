<app-page-banner
  title="Page Not Found"
  subtitle="The page you are looking for does not exist or has moved."
/>

<section class="not-found">
  <div class="container not-found__card">
    <span class="not-found__icon">
      <app-icon name="megaphone" [size]="26" />
    </span>
    <h2>We could not find that page.</h2>
    <p>
      Please check the address or return to the homepage to continue browsing the
      Bright Way School website.
    </p>
    <a class="btn btn--primary" routerLink="/">Back to Home</a>
  </div>
</section>
