@let about = content().about;

<section class="about">
  <div class="container about__grid">
    <div class="about__media">
      <app-media-frame
        class="about__photo"
        [src]="about.imageUrl"
        [alt]="about.imageAlt"
        ratio="4/3"
      />
      <span class="about__badge">{{ about.badge }}</span>
    </div>

    <div class="about__body">
      <p class="eyebrow">{{ about.eyebrow }}</p>
      <h2>{{ about.title }}</h2>
      <p class="about__text">{{ about.body }}</p>

      <a class="btn btn--primary" routerLink="/about">
        Read More
        <app-icon name="arrow-right" [size]="16" />
      </a>
    </div>
  </div>
</section>
