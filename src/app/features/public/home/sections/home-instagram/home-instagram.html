<section class="instagram">
  <div class="container">
    <div class="instagram__card" [class.instagram--solo]="!media()">
      <div class="instagram__body">
        <span class="instagram__icon"><app-icon name="instagram" [size]="26" /></span>
        <p class="instagram__eyebrow">Stay connected</p>
        <h2>Follow Us on Instagram</h2>
        <p class="instagram__handle">{{ settings().instagramHandle }}</p>
        <p class="instagram__text">Stay updated with our latest events and activities.</p>
        <a
          class="btn btn--primary"
          [href]="settings().instagramUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          Follow Now
          <app-icon name="arrow-up-right" [size]="16" />
        </a>
      </div>

      @if (media()) {
        <div class="instagram__shots" aria-hidden="true">
          @for (image of shots(); track image.id) {
            <app-media-frame [src]="image.imageUrl" alt="" ratio="1/1" />
          }
        </div>
      }
    </div>
  </div>
</section>
